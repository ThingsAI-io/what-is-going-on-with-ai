name: Validate content

on:
  push:
    paths:
      - "content/**"
      - "schema/**"
      - ".github/workflows/validate-content.yml"
  pull_request:
    paths:
      - "content/**"
      - "schema/**"
      - ".github/workflows/validate-content.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npx okf-validate --schemas schema content
